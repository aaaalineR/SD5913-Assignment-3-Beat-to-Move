
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Beat to Move</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: #101827;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    h1 {
      letter-spacing: 4px;
    }

    canvas {
      width: 90%;
      max-width: 800px;
      border: 2px solid #6ee7d2;
      border-radius: 12px;
    }

    p {
      color: #aabbd0;
    }
  </style>
</head>

<body>

  <h1>BEAT TO MOVE</h1>
  <button id="startButton">START RHYTHM</button>
  <canvas id="game" width="800" height="360"></canvas>
  <p>Step 1 — Our runner is moving!</p>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");

    let distance = 0;
    let lastTime = 0;
    
    let jumpHeight = 0;
    let jumpSpeed = 0;
    const gravity = 1350;
    
    // Step 4A: Rhythm System
    const bpm = 80;
    const beatDuration = 60 / bpm;

    let audioContext = null;
    let gameStarted = false;
    let previousBeat = -1;

    const startButton = document.getElementById("startButton");

    startButton.addEventListener("click", async function() {
      if (gameStarted) return;

      audioContext = new AudioContext();
      await audioContext.resume();

      gameStarted = true;
      startButton.textContent = "PLAYING...";
      startButton.disabled = true;
    });

    function playBeat(strongBeat) {
      if (!audioContext || audioContext.state !== "running") {
        return;
      }

      const now = audioContext.currentTime;
      const oscillator = audioContext.createOscillator();
      const volume = audioContext.createGain();

      oscillator.type = "sine";

      oscillator.frequency.setValueAtTime(
        strongBeat ? 880 : 600,
        now
      );

      volume.gain.setValueAtTime(0.15, now);
      volume.gain.exponentialRampToValueAtTime(
        0.001,
        now + 0.09
      );

      oscillator.connect(volume);
      volume.connect(audioContext.destination);

      oscillator.start(now);
      oscillator.stop(now + 0.1);
    }


    
    // Step 3: Obstacles
    const obstacles = [
      { x: 755, checked: false },
      { x: 1295, checked: false },
      { x: 1835, checked: false },
      { x: 2375, checked: false },
      { x: 2915, checked: false },
      { x: 3455, checked: false },
      { x: 3995, checked: false },
      { x: 4535, checked: false }
    ];

    const obstacleWidth = 28;
    const obstacleHeight = 28;

    let cleared = 0;
    let hits = 0;
    let feedback = "Press SPACE to avoid obstacles!";
    
    // Step 4B: Rhythm scoring
    let score = 0;
    let perfectHits = 0;
    let goodHits = 0;



    // Listen for the Space key
    
    // Step 4B: Rhythm-controlled jumping
    window.addEventListener("keydown", function(event) {
      if (event.code !== "Space") return;

      event.preventDefault();

      if (!gameStarted || event.repeat) return;

      // Find the next obstacle that has not been attempted
      const nextObstacle = obstacles.find(
        obstacle => !obstacle.attempted && !obstacle.checked
      );

      if (!nextObstacle) return;

      // One attempt per obstacle
      nextObstacle.attempted = true;

      // Current game time in seconds
      const currentTime = distance / 180;

      // Scheduled jump time for this obstacle
      const targetTime = (nextObstacle.x - 215) / 180;

      const timingError = currentTime - targetTime;
      const difference = Math.abs(timingError);

      if (difference <= 0.07) {
        nextObstacle.rating = "PERFECT";
        jumpSpeed = 570;
        feedback = "PERFECT!";

      } else if (difference <= 0.16) {
        nextObstacle.rating = "GOOD";
        jumpSpeed = 570;
        feedback = "GOOD!";

      } else {
        nextObstacle.rating = "MISS";

        feedback = timingError < 0
          ? "TOO EARLY!"
          : "TOO LATE!";
      }
    });


      
    function draw(time) {
      const dt = Math.min((time - lastTime) / 1000, 0.05);
      lastTime = time;

      // Step 4A: Move the world and play the rhythm
      if (gameStarted) {
        distance += dt * 180;

        const beatNumber = Math.floor(
          (distance / 180) / beatDuration
        );

        if (beatNumber !== previousBeat) {
          previousBeat = beatNumber;
          playBeat(beatNumber % 4 === 0);
        }
      }


      // Jump physics
      if (jumpSpeed !== 0 || jumpHeight > 0) {
        jumpHeight += jumpSpeed * dt;
        jumpSpeed -= gravity * dt;

        // Stop falling when reaching the ground
        if (jumpHeight <= 0) {
          jumpHeight = 0;
          jumpSpeed = 0;
        }
      }


      // Background
      ctx.fillStyle = "#192640";
      ctx.fillRect(0, 0, 800, 360);

      // Moving city buildings
      ctx.fillStyle = "#304363";

      for (let i = 0; i < 12; i++) {
        let x = ((i * 100 - distance * 0.25) % 1200 + 1200) % 1200 - 100;
        let height = 65 + (i % 4) * 18;
        ctx.fillRect(x, 270 - height, 65, height);
      }

      // Ground
      ctx.fillStyle = "#435878";
      ctx.fillRect(0, 270, 800, 90);

      // Moving ground lines
      ctx.fillStyle = "#8ba5c5";

      for (let i = 0; i < 18; i++) {
        let x = i * 62 - (distance % 62);
        ctx.fillRect(x, 300, 32, 4);
      }


      // Step 3: Draw obstacles and check collisions
      for (const obstacle of obstacles) {

        // Move obstacle with the scrolling world
        const x = obstacle.x - distance;
        const top = 270 - obstacleHeight;

        // Draw a pink triangle
        ctx.fillStyle = "#ff8192";
        ctx.beginPath();
        ctx.moveTo(x, 270);
        ctx.lineTo(x + obstacleWidth / 2, top);
        ctx.lineTo(x + obstacleWidth, 270);
        ctx.closePath();
        ctx.fill();

        // Approximate player collision box
        const playerLeft = 137;
        const playerRight = 163;
        const playerTop = 218 - jumpHeight;
        const playerBottom = 268 - jumpHeight;

        const overlapX =
          playerRight > x &&
          playerLeft < x + obstacleWidth;

        const overlapY =
          playerBottom > top &&
          playerTop < 270;

        // Player hits an obstacle
        if (!obstacle.checked && overlapX && overlapY) {
          obstacle.checked = true;
          hits++;
          feedback = "HIT! Try jumping earlier!";
        }

        // Player successfully passes an obstacle
        if (!obstacle.checked &&
            x + obstacleWidth < playerLeft) {

          obstacle.checked = true;
          cleared++;

          if (obstacle.rating === "PERFECT") {
            score += 100;
            perfectHits++;
            feedback = "PERFECT! +100";

          } else if (obstacle.rating === "GOOD") {
            score += 50;
            goodHits++;
            feedback = "GOOD! +50";

          } else {
            feedback = "CLEARED!";
          }
        }

      } // End of obstacles loop

      // Runner animation
      let bob = jumpHeight > 0 ? 0 : Math.sin(time * 0.015) * 2;
      let step = jumpHeight > 0 ? 0 : Math.sin(time * 0.015) * 11;

      ctx.save();
      ctx.translate(0, -jumpHeight);

      ctx.strokeStyle = "#ffd39b";
      ctx.fillStyle = "#ffd39b";
      ctx.lineWidth = 6;
      ctx.lineCap = "round";

      // Head
      ctx.beginPath();
      ctx.arc(150, 216 + bob, 12, 0, Math.PI * 2);
      ctx.fill();

      // Body
      ctx.beginPath();
      ctx.moveTo(150, 229 + bob);
      ctx.lineTo(150, 249 + bob);

      // Arms
      ctx.moveTo(150, 235 + bob);
      ctx.lineTo(139 + step * 0.5, 244 + bob);

      ctx.moveTo(150, 235 + bob);
      ctx.lineTo(161 - step * 0.5, 244 + bob);

      // Legs
      ctx.moveTo(150, 249 + bob);
      ctx.lineTo(140 + step, 267 + bob);

      ctx.moveTo(150, 249 + bob);
      ctx.lineTo(160 - step, 267 + bob);

      ctx.stroke();

      ctx.restore();

      // Status
      ctx.fillStyle = "white";
      ctx.font = "16px Arial";
      ctx.fillText("RUNNING...", 24, 32);

      ctx.fillText(
        "CLEARED: " + cleared + " | HITS: " + hits,
        24, 58
      );

      ctx.fillText(feedback, 24, 84);
      
      // Step 4B: Score display
      ctx.fillStyle = "#6ee7d2";
      ctx.font = "15px Arial";

      ctx.fillText(
        "SCORE: " + score +
        " | PERFECT: " + perfectHits +
        " | GOOD: " + goodHits,
        24,
        138
      );

      // Countdown to the next required jump
      const upcoming = obstacles.find(
        obstacle => !obstacle.attempted && !obstacle.checked
      );

      if (upcoming && gameStarted) {
        const target = (upcoming.x - 215) / 180;
        const remaining = target - distance / 180;

        ctx.fillText(
          "NEXT JUMP: " +
          Math.max(0, remaining).toFixed(1) + "s",
          24,
          164
        );
      }

      
      // Visual rhythm indicator
      const beatPhase =
        (distance / 180) % beatDuration;

      const isPulsing =
        gameStarted && beatPhase < 0.12;

      ctx.fillStyle = isPulsing ? "#6ee7d2" : "#516484";

      ctx.beginPath();
      ctx.arc(745, 45, isPulsing ? 17 : 11, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#ffffff";
      ctx.font = "14px Arial";

      ctx.fillText(
        gameStarted ? "RHYTHM: 80 BPM" : "CLICK START RHYTHM",
        24,
        110
      );


      requestAnimationFrame(draw);
    }

    requestAnimationFrame(draw);
  </script>

</body>
</html>
